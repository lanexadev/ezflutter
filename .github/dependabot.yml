version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      dart-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    groups:
      github-actions:
        patterns: ["*"]
