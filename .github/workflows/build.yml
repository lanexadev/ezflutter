name: Mobile build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run packages/nativiq_cli/bin/nativiq.dart create build_app --output "$RUNNER_TEMP/build_app" --local-framework "$GITHUB_WORKSPACE/packages/nativiq"
      - working-directory: ${{ runner.temp }}/build_app
        run: flutter build apk --debug --flavor dev --target lib/main_dev.dart --dart-define=APP_ENV=dev

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run packages/nativiq_cli/bin/nativiq.dart create build_app --output "$RUNNER_TEMP/build_app" --local-framework "$GITHUB_WORKSPACE/packages/nativiq"
      - working-directory: ${{ runner.temp }}/build_app
        run: flutter build ios --simulator --debug --target lib/main_dev.dart --dart-define=APP_ENV=dev
