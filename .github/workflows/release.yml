name: Release

on:
  push:
    tags: ['v3.*']

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: flutter test packages/nativiq
      - run: dart test packages/nativiq_cli
      - run: dart pub publish --dry-run
        working-directory: packages/nativiq
      - run: dart pub publish --dry-run
        working-directory: packages/nativiq_cli
      - run: tar -czf nativiq-cli-${GITHUB_REF_NAME}.tar.gz packages/nativiq_cli
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: nativiq-cli-${{ github.ref_name }}.tar.gz
