name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: flutter test packages/start_dart
      - run: dart test packages/start_dart_cli
      - run: dart pub publish --dry-run
        working-directory: packages/start_dart
      - run: dart pub publish --dry-run
        working-directory: packages/start_dart_cli
      - run: tar -czf start-dart-${GITHUB_REF_NAME}.tar.gz packages/start_dart packages/start_dart_cli template AGENTS.md LICENSE README.md
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: start-dart-${{ github.ref_name }}.tar.gz
