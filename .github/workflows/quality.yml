name: Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed packages
      - run: dart analyze --fatal-infos
      - run: flutter test packages/start_dart
      - run: dart test packages/start_dart_cli
      - run: .agents/hooks/check-agent-contract.sh

  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart run packages/start_dart_cli/bin/startdart.dart create ci_app --output "$RUNNER_TEMP/ci_app" --local-framework "$GITHUB_WORKSPACE/packages/start_dart"
      - working-directory: ${{ runner.temp }}/ci_app
        run: flutter pub get && flutter analyze --fatal-infos && flutter test

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
